<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathPilot AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>MathPilot AI</h1>

    <p>Your personal AI mathematics assistant.</p>

    <div class="solver">
        <h2>What mathematics problem are you solving?</h2>

        <textarea
            placeholder="Enter your mathematics question here..."
            rows="5">
        </textarea>

        <button>Solve Problem</button>

        <div class="answer">
            <h3>Your Solution</h3>
            <p>Your answer will appear here.</p>
        </div>
    </div>

</body>
</html>
